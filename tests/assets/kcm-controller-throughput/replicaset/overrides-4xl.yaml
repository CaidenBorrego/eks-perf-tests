# Full run: 5,000 ReplicaSets, 1,000 patches/s inside each wave (one wave
# patches all 5,000 in about 5 s, then waits for reconcile). The wave count
# comes from the Task's waves param (run-overrides.yaml, written by prepare).
CL2_NAMESPACES: 50
CL2_RS_PER_NAMESPACE: 100
CL2_LOAD_QPS: 1000
# Wait after setup before the load, and after reconcile before the delete.
CL2_SETTLE: 5m
CL2_POST_SETTLE: 5m
