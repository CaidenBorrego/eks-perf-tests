apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: {{.Name}}
  labels:
    group: rs-test
    size: {{.Size}}
spec:
  replicas: {{.Replicas}}
  selector:
    matchLabels:
      name: {{.Name}}
  template:
    metadata:
      labels:
        name: {{.Name}}
        group: rs-test
        size: {{.Size}}
    spec:
      # KWOK fake nodes only; the image is never pulled.
      nodeSelector:
        type: kwok
      tolerations:
      - key: kwok.x-k8s.io/node
        operator: Exists
        effect: NoSchedule
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: 10m
            memory: 10Mi
